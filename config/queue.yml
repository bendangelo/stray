# Solid Queue configuration.
#
# Optimized for a single-process, single-user self-hosted deploy: the Solid
# Queue supervisor runs inside the Puma process (SOLID_QUEUE_IN_PUMA) and the
# queue database is SQLite. Polling intervals are a bit relaxed to avoid
# hammering SQLite with idle polls; thread counts stay low because a single
# user doesn't generate heavy job volume.

default: &default
  dispatchers:
    - polling_interval: 3
      batch_size: 100
  workers:
    - queues: "polling"
      threads: 1
      processes: 1
      polling_interval: 3
    - queues: "default"
      threads: 1
      processes: 1
      polling_interval: 3

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
